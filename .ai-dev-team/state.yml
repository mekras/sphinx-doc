setup:
  review:
    directions:
    - name: рабочий контекст проекта
      status: сделано
      basis: 'Прямой ответ пользователя: «Некоммерческий»'
      evidence: Ответ пользователя в текущем диалоге настройки
      limitations: []
    - name: профиль проекта
      status: сделано
      basis: Профиль предложен по файлам проекта и подтверждён пользователем
      evidence: README.md, Dockerfile, Makefile, project-template и ответ пользователя «Верно»
        в текущем диалоге
      limitations: []
    - name: концепция проекта
      status: сделано
      basis: Пользователь подтвердил текст концепции и создание корневого указателя
      evidence: 'Концепция сохранена во вводном абзаце README.md, AGENTS.md однозначно указывает
        на него. Самопроверка ait-docs-concept: проблема ручной настройки, цель готовой среды,
        способ Docker и итог в виде образа и шаблона отражены в согласованном тексте.'
      limitations: []
    - name: README.md
      status: сделано
      basis: Пользователь согласовал текст инструкции и поручил убрать две команды ручной
        подготовки, исправив шаблон.
      evidence: 'Согласованный текст записан в README.md без mkdir и mv. Самопроверка ait-readme
        и проверка с позиции автора документации: названы условия запуска, копирование, настройки,
        сборка, пути результатов, очистка и предпросмотр. cp создаёт отдельный проект, make
        пишет результаты только в htdocs. Вводная концепция сохранена. Сборки свежих копий
        и HTTP-предпросмотр проверены на образах latest и 8.2.3.'
      limitations:
      - Предпросмотр проверен на свободном порту, поскольку порт 8000 занят другим контейнером.
        Автоматическое обновление вкладки браузера визуально не проверялось.
    - name: правила для агентов и клиентские инструкции
      status: сделано
      basis: Пользователь согласовал создание AGENTS.md и политику добавления только изменений
        агента
      evidence: 'Самопроверка ai-audit-agent-rules: AGENTS.md служит корневым входом Codex,
        содержит маршрутизатор, концепцию, границы правок, Git и правило журнала изменений.
        Пути ait-routing, ai-human-communication, human-texts.md и ait-changelog существуют.
        Противоречий между добавленными правилами и подтверждёнными решениями не найдено.
        Граф влияния подключён в AGENTS.md. Самопроверка добавленного правила: путь существует,
        процедура ait-impact-analysis доступна, принятые приоритеты и политика Git сохранены.'
      limitations:
      - Поведение новой корневой сессии не проверялось
      - Клиентские инструкции рукописные, компиляция APM не выполнялась
    - name: журнал изменений
      status: сделано
      basis: Пользователь согласовал точные тексты двух записей для раздела «Не выпущено».
      evidence: 'CHANGELOG.md: запись об инструкции добавлена в «Добавлено», запись о первом
        запуске шаблона — в «Исправлено». Самопроверка ait-changelog: согласованный текст
        сохранён, записи описывают действия и результат пользователя. Сборка и предпросмотр
        из свежей копии проверены в предыдущем шаге. Существующие записи и версия Sphinx сохранены.'
      limitations: []
    - name: журналы решений
      status: сделано
      basis: Пользователь последовательно согласовал вид и область журнала, путь, имена и
        правила ведения
      evidence: 'docs/ADR/README.md. Самопроверка ait-decisions: назначение и границы соответствуют
        концепции образа и шаблона. Сохранены содержание записи, пять статусов, принятие человеком
        до действия, имена ADR-NNNN.md и пустой реестр. Записи ADR отсутствуют, реестр соответствует
        составу каталога.'
      limitations: []
    - name: корпус знаний
      status: не требуется
      basis: Прямой отказ пользователя от корпуса знаний
      evidence: Ответ «Нет» на предложение включить корпус знаний в проект
      limitations: []
    - name: разработка на основе спецификаций
      status: не требуется
      basis: Условия инициативного предложения ait-reconstructability не выявлены
      evidence: 'Подтверждённый профиль: образ Docker и шаблон документации. Dockerfile и
        Makefile задают существующую реализацию и стандартную сборку. Запроса на генерацию
        реализации из спецификаций, смену платформы или проверку восстановления нет.'
      limitations:
      - Проверка восстановления не проводилась, свойство реконструируемости не заявлено
    - name: граф влияния проекта
      status: сделано
      basis: Пользователь подтвердил 8 частей проекта, связи, проверки и исключение установленных
        проекций
      evidence: 'project-impact.json: schema_version=2, 8 узлов, 28 рёбер. Структура проверена
        без проблем. Итоговое покрытие: 21 путь, несопоставленных путей нет. Полная трасса
        изменения шаблона, тестов, документации и учёта настройки проверена. assess: complete=true,
        blocking_statuses и missing_statuses пусты. Образ и журнал решений проверены без необходимости
        правки. Шаблон, тесты и пользовательская документация обновлены и проверены. Указатель
        и правило применения записаны в AGENTS.md.'
      limitations:
      - Автоматические проверки графа подтверждают структуру и обход связей. Проверки исполнения
        шаблона описаны отдельно в template_verification.
    - name: уровень интерфейсных проверок
      status: сделано
      basis: Пользователь выбрал обязательные автоматические проверки, правило записано в
        AGENTS.md.
      evidence: 'Правило проверено. Для исправления шаблона заранее названы сборки HTML/PDF
        и HTTP-предпросмотр. tests/test_template.py: четыре проверки прошли на latest и 8.2.3.
        Предпросмотр вернул HTTP 200 и пересобрал изменённую страницу на обоих образах.'
      limitations:
      - Предпросмотр запускался на свободном порту вместо занятого 8000. Визуальная проверка
        браузера не выполнялась.
    - name: .gitignore
      status: сделано
      basis: Пользователь согласовал четыре исключения для установленных проекций, кеша Python
        и результата сборки шаблона
      evidence: В .gitignore добавлены .agents/skills/, .codex/agents/, __pycache__/ и /project-template/htdocs/.
        Исходные исключения сохранены. В индекс добавлен только согласованный блок.
      limitations: []
    - name: лицензия
      status: сделано
      basis: Существующая лицензия сохранена, новая лицензия не выбиралась.
      evidence: 'Самопроверка ait-licensing в области организации сведений: LICENSE содержит
        заголовок MIT License, уведомление Copyright (c) 2019 Михаил Красильников и полный
        текст условий. Файл не изменён. Для проверки применён публичный режим по умолчанию
        навыка.'
      limitations:
      - Совместимость лицензий всех пакетов внутри образа и базовой системы отдельно не проверялась.
    - name: подагенты
      status: не требуется
      basis: 'Прямое решение пользователя: «Без подагентов».'
      evidence: Отказ сохранён в setup.subagents. Настройка и испытания делегирования не выполнялись.
      limitations: []
    - name: индекс Git, схема сообщений коммитов и проверки
      status: сделано
      basis: Политика индекса «только изменения агента» и схема сообщений Pro Git согласованы
        пользователем.
      evidence: 'git diff --check и git diff --cached --check без ошибок. Прежние фрагменты
        .gitignore и README.md оставлены вне индекса, apm.yml и apm.lock.yaml не добавлялись.
        Новые файлы и собственные правки добавлены в индекс. apm audit --ci: все 10 проверок
        прошли, дрейфа нет. Сборки и HTTP-предпросмотр проверены отдельно.'
      limitations:
      - Коммит и отправка не выполнялись, поскольку пользователь их не поручал.
    - name: приоритеты проектных решений
      status: сделано
      basis: Пользователь принял предложенный порядок пяти приоритетов
      evidence: 'Пять приоритетов приняты пользователем и в том же порядке записаны в AGENTS.md,
        раздел «Приоритеты проектных решений». Самопроверка ai-audit-agent-rules: правило
        соответствует решению пользователя и концепции проекта, не задаёт непроверенных сроков
        или бюджетных ограничений.'
      limitations: []
    status: complete
    completed_at: '2026-10-18'
    evaluation: Самопроверка по критериям ait-setup и ai-work-result-evaluation. Все 16 направлений
      имеют основания и свидетельства. Согласованные решения сопоставлены с сохранёнными файлами.
      Прежние изменения Git сохранены. Блокирующих вопросов нет. Ограничения наблюдения новой
      сессии, визуальной проверки браузера и лицензионной проверки зависимостей записаны в
      соответствующих направлениях.
  operating_context:
    kind: noncommercial
  project_profile:
    forms:
    - Образ Docker для сборки документации Sphinx
    - Шаблон нового проекта документации
    users:
    - Авторы документации
    interfaces:
    - Docker CLI
    - Команды Make
    - Просмотр документации и локального предпросмотра в браузере
    delivery:
    - Образ Docker
    - Шаблон project-template в репозитории
  concept:
    status: present
    confirmed_problem: Авторам документации приходится вручную устанавливать и настраивать
      Sphinx, LaTeX, поддержку русского языка и расширений. Проект нужен, чтобы пользоваться
      готовой средой в Docker.
    path: README.md (вводный абзац)
    text: Проект предоставляет авторам документации готовую среду Sphinx в Docker, чтобы не
      приходилось вручную устанавливать и настраивать Sphinx, LaTeX, поддержку русского языка
      и расширений. Результат — образ Docker и шаблон проекта для сборки HTML/PDF и локального
      предпросмотра документации.
  git:
    status: present
    staging_policy: agent_changes_only
  client_instructions:
    client: codex
    path: AGENTS.md
    management: handwritten
    local_rules_path: AGENTS.md
  commit_messages:
    scheme: pro-git
  changelog:
    status: present
    path: CHANGELOG.md
  decision_records:
    status: present
    journals:
    - kind: ADR
      scope: Значимые архитектурные решения об устройстве образа Docker и шаблона проекта
        документации
      status: present
      path: docs/ADR/
      filename_format: ADR-NNNN.md
      identifier_format: ADR-NNNN
      registry: docs/ADR/README.md
      contract: docs/ADR/README.md
      acceptance: human_approval_before_implementation
  knowledge_corpus:
    status: declined
    note: Пользователь решил работать без корпуса знаний. Повторно не предлагать без отдельного
      запроса.
  sdd:
    status: not_applicable
    reason: Нет прямого запроса и выявленной потребности в реконструируемости из спецификаций.
      Существующий проект поставляет образ по Dockerfile и стандартную сборку документации
      Sphinx. Само использование генератора не требует принятия разработки на основе спецификаций.
  decision_priorities:
    status: accepted
    order:
    - Надёжная сборка и совместимость
    - Простота для автора документации
    - Предсказуемость обновлений
    - Обратимость изменений
    - Новые возможности
    basis: 'Предложение по анализу README.md, Dockerfile, Makefile и шаблона проекта принято
      пользователем: «Принимается».'
    operational_rule_status: present
    operational_rule_path: AGENTS.md
  impact_graph:
    status: present
    path: .ai-dev-team/project-impact.json
    schema_version: 2
  interface_checks:
    applicable: true
    level: required
    scenarios:
    - Команды сборки документации HTML и PDF
    - Команда локального предпросмотра
    rule_path: AGENTS.md
    basis: 'Пользователь выбрал вариант 1: заранее названные автоматические проверки обязательны,
      недоступность среды блокирует готовность изменения пользовательских команд.'
  subagents:
    status: creation_declined
    enabled: false
    basis: 'Прямое решение пользователя: «Без подагентов».'
    note: Работу и профильные проверки выполняет основной агент. Не запускать настройку и
      испытания подагентов автоматически. Пересмотр только по прямому поручению пользователя.
  license:
    status: present
    path: LICENSE
    identifier: MIT
  template_verification:
    status: passed
    command: python tests/test_template.py -v
    images:
    - mekras/sphinx-doc:latest
    - mekras/sphinx-doc:8.2.3
    latest_digest: sha256:790a9ffdac8b04ef65fa6e17a22afa9b5013e7730c5a626376c69e623335fde8
    cases:
    - 'make all из свежей копии: HTML и PDF'
    - make html из свежей копии
    - make pdf из свежей копии
    - make clean создаёт каталог и сохраняет .gitignore и robots.txt
    negative_case: Проверка clean воспроизводит ошибку отсутствующего htdocs на исходном Makefile
      из HEAD.
    preview: 'На обоих образах: HTTP 200, начальная страница и пересборка после изменения
      исходника. Команда из make -n start-server, изменён только внешний порт на свободный.'
    review: 'Самопроверка: требования и назначение среды сохранены. Создание каталога перенесено
      в сборку, начальная страница перемещена без изменения содержимого. Образ, расширения
      и архитектурные границы не менялись. Пользовательская инструкция согласована и дополнена.
      Новая запись ADR не требуется для обычного обратимого исправления.'
    limitations:
    - Порт 8000 занят прежним контейнером, его состояние не изменялось.
    - Обновление вкладки браузера визуально не проверялось.
    impact_review:
      changed:
      - template:interface
      - template:structure
      - build-tests:quality
      - user-docs:documentation
      - development:operation
      checks:
        build-tests: updated
        template: updated
        image: verified_no_impact
        decisions: verified_no_impact
        user-docs: updated
      reason: Тексты CHANGELOG.md согласованы и внесены. assess завершился с кодом 0, complete=true.
        Все затронутые части проверены, несопоставленных путей и незакрытых итогов нет.
product: mekras/ai-dev-team
updated_at: '2026-10-18'
